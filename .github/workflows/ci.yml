name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lilypad_test
          POSTGRES_PASSWORD: lilypad_test
          POSTGRES_DB: lilypad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lilypad_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LILYPAD_TEST_DSN: postgres://lilypad_test:lilypad_test@localhost:5432/lilypad_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate, race-test and package all targets
        run: python3 build.py --require-database --race
      - name: Upload validated packages
        uses: actions/upload-artifact@v6
        with:
          name: lilypad-linux-and-windows
          path: |
            dist/releases/dev/*.zip
            dist/releases/dev/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: docker/setup-buildx-action@v3
      - name: Check container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: lilypad:ci
          cache-from: type=gha,scope=container-ci
          cache-to: type=gha,mode=max,scope=container-ci

  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate native Windows build and unit tests
        run: python build.py --platforms windows-amd64
      - name: Upload native Windows package
        uses: actions/upload-artifact@v6
        with:
          name: lilypad-windows-native
          path: |
            dist/releases/dev/*.zip
            dist/releases/dev/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
