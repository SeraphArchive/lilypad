name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-assets:
    if: startsWith(github.event.release.tag_name, 'lilypad-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lilypad_test
          POSTGRES_PASSWORD: lilypad_test
          POSTGRES_DB: lilypad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lilypad_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LILYPAD_TEST_DSN: postgres://lilypad_test:lilypad_test@localhost:5432/lilypad_test?sslmode=disable
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate, race-test and package release
        run: python3 build.py --version "${RELEASE_TAG#lilypad-v}" --require-database --race
      - name: Prepare image identity
        id: image
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${RELEASE_TAG#lilypad-v}"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          latest=false
          if [[ "$RELEASE_PRERELEASE" == false && "$version" != *-* ]]; then
            latest=true
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Describe release image
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ steps.image.outputs.latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
      - name: Build and publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: |
            type=gha,scope=container-release
            type=gha,scope=container-ci
          cache-to: type=gha,mode=max,scope=container-release
      - name: Attach assets to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#lilypad-v}"
          gh release upload "$RELEASE_TAG" dist/releases/"$version"/*.zip dist/releases/"$version"/*.sha256 --clobber
