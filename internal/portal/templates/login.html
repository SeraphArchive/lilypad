{{define "title"}}Log in{{end}}
{{define "content"}}
<h1>Log in</h1>
<form method="post" action="/login" class="card form">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Email
    <input type="email" name="email" required autofocus value="{{.Email}}">
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Log in</button>
  <button type="submit" formaction="/verify/resend">Resend verification email</button>
</form>
<p class="muted">No account? <a href="/register">Register</a>.</p>
{{end}}
